# Per-package workflow: only pkgname + deps live here; the gates are in pkgs/packaging's rust-pkg.yml.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  pkg:
    uses: pkgs/packaging/.gitea/workflows/rust-pkg.yml@main
    with:
      pkgname: clockmost-shell
      # makepkg runs without sudo in CI: runtime depends must be preinstalled here
      extra_pacman_deps: "quickshell qt6-websockets sqlite wl-clipboard clevis"
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
