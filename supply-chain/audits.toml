version = "6.0.0"
notes = "reviewed 2026-10-17 (zbus 5->6 migration): no build.rs; no network/fs/process/env use outside the crate's stated purpose; no obfuscation, encoded payloads or off-purpose URLs. Process spawns only for D-Bus spec transports (unixexec:, launchd, ibus) or in tests; env reads = DBUS_*_BUS_ADDRESS, XDG_RUNTIME_DIR, PATH; base64/hex = SASL handshake."

