notes = "reviewed 2026-10-17 (zbus 5->6 migration): no build.rs; no network/fs/process/env use outside the crate's stated purpose; no obfuscation, encoded payloads or off-purpose URLs. Socket option wrappers over libc/windows-sys; unsafe = FFI. Publisher trusted by mozilla + bytecodealliance."

[[audits.zbus]]
who = "Benylin <lealmariop@gmail.com>"
