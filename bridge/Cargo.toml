[package]
publish = false
name = "kwin-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
async-io = "2.6.0"
futures-lite = "2.6.1"
serde = "1.0.229"
zbus = { version = "6.0.0", default-features = false, features = ["default-rt", "service"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
